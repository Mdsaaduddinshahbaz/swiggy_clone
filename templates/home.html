<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Clone | Food Delivery</title>
    <link rel="stylesheet" href="../static/user_navbar.css">
    <link rel="stylesheet" href="../static/cart.css">
    <link rel="stylesheet" href="../static/orders.css">
    <link rel="stylesheet" href="../static/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

    <!-- ============================================================
         SHARED HEADER — always live in the DOM, never swapped.
    ============================================================= -->
    <header class="navbar">
        <div class="nav-container">
            <div class="left-nav">
                <div class="location-overlay" id="locationOverlay"></div>
                <div style="display: flex;flex-direction: column;">
                    <div style="display: flex; justify-content: space-between;">
                        <div class="location-trigger" id="locationTrigger">
                            <i class="fa-solid fa-location-dot"></i>
                            <span id="currentAddress">Select Location</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <img src="../static/profile.png" alt="Swiggy Logo" class="logo" id="profileLogo">
                    </div>
                    <div class="searchBarContainer">
                        <input type="text" placeholder="Enter Resturant Name..." id="searchInput">
                    </div>
                </div>

                <div class="location-box" id="locationBox">
                    <div class="location-header">
                        <i class="fa-solid fa-location-dot"></i>
                        <span id="currentAddresss">Select delivery location</span>
                    </div>

                    <div class="location-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="addressInput" placeholder="Search for area, street, city...">
                    </div>
                    <div id="savedAddress">
                        <h2 style="color: black; top: 10px; font-size: 22px; left: 5px; position: relative;">Saved Address</h2>
                    </div>
                    <button id="liveLocationBtn" class="live-location-btn">
                        <i class="fa-solid fa-location-crosshairs"></i>
                        Use Current Location
                    </button>
                    <button id="map_btn" class="live-location-btn" is_active="false">
                        <i class="fa-solid fa-location-crosshairs"></i>
                        Select on Map
                    </button>
                    <div id="map_container">
                        <div id="map" style="height: 250px; border-radius: 15px; margin-top: 10px;"></div>
                    </div>
                    <div id="suggestions"></div>
                </div>
            </div>

            <nav class="app-navbar" id="appNavbar">
                <div class="navbar-indicator" id="navbarIndicator"></div>

                <a href="#home" class="nav-item active" data-page="home">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="#orders" class="nav-item" data-page="orders">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Orders</span>
                </a>

                <a href="#cart" class="nav-item" data-page="cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- ============================================================
         PAGE TEMPLATES — inert until spa_router.js clones one of
         these into #spa-content. Only ONE page's markup is ever
         live in the document at a time, which is what home.js /
         cart.js / orders.js already assume (see their `if (!el)
         return;` guards).
    ============================================================= -->
    <template id="tpl-home">
        <main class="container">
            <div id="loading_container">
                <h1>fetching location...</h1>
                <img src="../static/loading-spinner.svg" alt="Loading" id="loading_fetch" class="show">
            </div>

            <div id="addressTagModal" class="modal">
                <div class="modal-content">
                    <h3>Save Address As</h3>
                    <div class="tag-options">
                        <button class="tag-btn" data-tag="Home">🏠 Home</button>
                        <button class="tag-btn" data-tag="Work">💼 Work</button>
                        <button class="tag-btn" data-tag="Other">📍 Other</button>
                    </div>
                    <button id="closeModal" class="cancel-btn">Cancel</button>
                </div>
            </div>

            <section class="filters" style="display: flex;justify-content: space-between;">
                <h2 id="Note">Restaurants with online food delivery in Hyderabad</h2>
                <div id="distancediv">
                    <select name="distance" id="distance_options">
                        <option value="5">5km</option>
                        <option value="10">10km</option>
                        <option value="20">20km</option>
                        <option value="30">30km</option>
                        <option value="50">50km</option>
                    </select>
                </div>
            </section>

            <img src="../static/loading-spinner.svg" alt="Loading" id="loading">
            <section class="restaurant-grid" id="resturants_container"></section>

            <div id="no-results-container" style="text-align: center; padding: 50px 20px;">
                <div class="icon-circle" style="font-size: 50px; margin-bottom: 20px;">📍</div>
                <h2 style="color: #333; margin-bottom: 10px;">No Restaurants Found Near You</h2>
                <p style="color: #666; margin-bottom: 25px;">
                    It looks like we don't have any partners within 5km of your location.
                    Try checking a different area.
                </p>
                <button onclick="location.reload()" style="background: #ff4757; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                    Try Again / Refresh
                </button>
            </div>
        </main>

        <div class="access_container" id="deny">
            <div class="icon">📍</div>
            <h1>Location Access Required</h1>
            <p style="color: #666; line-height: 1.6; margin-bottom: 25px;">
                We use your location to find nearby restaurants and provide
                accurate distance-based results.
            </p>
            <button id="requestlocation">Allow Location Access</button>
            <div class="help-text">
                If you previously denied access, enable location permissions
                in your browser settings and refresh the page.
            </div>
        </div>
    </template>

    <template id="tpl-orders">
        <div class="orders-container">
            <div class="header">
                <h1>Your Orders</h1>
                <select id="filterDropdown">
                    <option value="placed">Pending</option>
                    <option value="all">All Orders</option>
                    <option value="completed">Completed</option>
                    <option value="canceled">Canceled</option>
                </select>
            </div>

            <div class="empty-state" id="No_orders_container">
                <div class="icon">🛍️</div>
                <h1>No Orders Yet</h1>
                <p>
                    Looks like you haven't placed any orders yet.
                    Start exploring our products and find something you'll love.
                </p>
                <button class="btn" id="shopBtn">Start Shopping</button>
            </div>

            <div id="orders-list"></div>
        </div>
    </template>

    <template id="tpl-cart">
        <main class="cart-container">

            <div class="empty-state" id="No_orders_container">
                <div class="icon">🛒</div>
                <h1>Your Cart is Empty</h1>
                <p>
                    Looks like you haven't added any items yet.
                    Start exploring our products and find something you'll love.
                </p>
                <button class="btn" id="shopBtn">Start Shopping</button>
            </div>

            <div class="cart-left">
                <div class="checkout-card active-step">
                    <div class="step-header">
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <h3>Delivery Address</h3>
                            <p id="type">Home -</p>
                            <p id="Deliveryaddress">Home - Madhapur, Hyderabad, Telangana 500081</p>
                        </div>
                    </div>
                    <button class="change-btn" id="ChangeAdrs">CHANGE</button>

                    <div id="loading_container">
                        <h1>fetching location...</h1>
                        <img src="../static/loading-spinner.svg" alt="Loading" id="loading" class="show">
                    </div>

                    <div id="addressOptions" class="address-options">
                        <!-- Renamed from "liveLocationBtn": the header above has its own
                             button with that id and stays live in the DOM the whole time,
                             so this one needs to be distinct or getElementById("liveLocationBtn")
                             will silently grab the header's button instead of this one. -->
                        <button id="cart-liveLocationBtn" class="live-location-btn">
                            <i class="fa-solid fa-location-crosshairs"></i>
                            Use Current Location
                        </button>
                        <h2>Saved Location</h2>
                    </div>
                </div>

                <div class="checkout-card">
                    <div class="step-header">
                        <i class="fa-solid fa-wallet"></i>
                        <div><h3>Payment</h3></div>
                    </div>
                    <p class="payment-hint">Select your payment method after reviewing the items.</p>

                    <div id="paymentOptions" class="payment-options">
                        <label class="payment-option">
                            <input type="radio" name="payment" value="cash" checked>
                            <span>💵 Cash on Delivery</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="upi">
                            <span>📱 UPI</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="card">
                            <span>💳 Card</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="cart-right">
                <div class="order-summary-card">
                    <div class="res-mini-header">
                        <img src="https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=50&q=80" alt="Res">
                        <div class="res-info"><h4>Burger King</h4></div>
                    </div>
                    <div class="cart-items" id="cart_items"></div>
                </div>

                <div class="coupon-box">
                    <i class="fa-solid fa-percent"></i>
                    <input type="text" placeholder="Apply Coupon">
                </div>

                <div class="bill-details">
                    <h5>Bill Details</h5>
                    <div class="bill-row"><span>Item Total</span><span id="totalPrice">₹0</span></div>
                    <hr>
                    <div class="bill-row total"><span>TO PAY</span><span id="toPay">₹0</span></div>
                </div>

                <button id="placeorder" class="pay-btn">Place Order</button>
            </div>
        </main>
    </template>

    <!-- ============================================================
         Router clones exactly one template's content in here.
    ============================================================= -->
    <div id="spa-content"></div>

    <script src="../static/spa_router.js"></script>
    <script src="../static/home.js"></script>
    <script src="../static/cart.js"></script>
    <script src="../static/user_navbar.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
