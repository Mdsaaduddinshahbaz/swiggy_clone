<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Burger King Menu | Swiggy Clone</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <div class="left-nav">
            <img
                src="{{ url_for('static', filename='logo2.png') }}"
                alt="MENU"
                id="cart"
            >
        </div>

        <nav class="right-nav">

            <div class="search-container" id="searchContainer">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search restaurant name...."
                    autocomplete="off"
                >
            </div>

            <ul>

                <li id="searchBtn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Search
                </li>

                <li id="hideCartOrderBtn" class="menu-toggle">
                    ☰
                </li>

                <div id="CartOrderContainer" class="hide">

                    <li id="orderBtn">
                        <i class="fa-solid fa-receipt"></i>
                        Orders
                    </li>

                    <li id="cartBtn">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Cart
                    </li>

                </div>

            </ul>

        </nav>

    </div>

</header>


<main class="menu-container">

    <img
        src="{{ url_for('static', filename='loading-spinner.svg') }}"
        alt="Loading"
        id="loading"
    >

    <nav class="breadcrumbs">
        Home / Hyderabad / <span>Burger King</span>
    </nav>


    <!-- Restaurant information -->

    <section class="res-header">

        <div class="res-info">

            <h1>Burger King</h1>

            <p class="res-location">
                Banjara Hills, 2.5 km
            </p>

        </div>

    </section>


    <div class="res-delivery-info">

        <span>
            <i class="fa-solid fa-clock"></i>
            25-30 MINS
        </span>

        <span>
            <i class="fa-solid fa-indian-rupee-sign"></i>
            ₹350 for two
        </span>

    </div>


    <hr class="divider">


    <!-- CATEGORY TABS -->

    <div
        class="category-tabs"
        id="categoryTabs"
        role="tablist"
        aria-label="Food categories"
    >

        <div
            class="category-tabs-indicator"
            id="categoryTabsIndicator"
        ></div>

        <button
            class="category-tab active"
            type="button"
            data-cat-id="all"
        >
            All
        </button>

    </div>


    <!-- SUBCATEGORY TABS -->

    <div
        class="subcategory-tabs"
        id="subcategoryTabs"
        role="tablist"
        aria-label="Food subcategories"
    >

        <div
            class="subcategory-tabs-indicator"
            id="subcategoryTabsIndicator"
        ></div>

    </div>


    <!-- MENU -->

    <section
        class="menu-section"
        id="menu_container"
    ></section>


    <!-- REPLACE CART MODAL -->

    <div
        class="overlay"
        id="overlayContainer"
    ></div>

    <section
        id="ReplaceContainer"
        aria-hidden="true"
    >

        <span id="message">
            Error:
        </span>

        <div id="controlBtn">

            <button id="NO" type="button">
                NO
            </button>

            <button id="YES" type="button">
                YES
            </button>

        </div>

    </section>

</main>


<!-- CART FOOTER -->

<footer>

    <div id="goToCartContainer">

        <div id="TotalPrice">

            <span>Total:</span>

            <span id="amount">
                0
            </span>

        </div>

        <span id="GoCartBtn">
            Go To Cart ▶
        </span>

    </div>

</footer>


<script src="{{ url_for('static', filename='menu.js') }}"></script>

</body>

</html>
