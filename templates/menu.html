<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Burger King Menu | Swiggy Clone</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <div class="left-nav">
            <img
                src="{{ url_for('static', filename='logo2.png') }}"
                alt="MENU"
                id="cart"
            >
        </div>

        <nav class="right-nav">

            <ul>

                <li id="hideCartOrderBtn" class="menu-toggle">
                    <i class="fa-solid fa-bars"></i>
                </li>

                <div id="CartOrderContainer" class="hide">

                    <li id="orderBtn">
                        <i class="fa-solid fa-receipt"></i>
                        Orders
                    </li>

                    <li id="cartBtn">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Cart
                        <span class="badge" id="navCartBadge">0</span>
                    </li>

                </div>

            </ul>

        </nav>

    </div>

</header>


<main class="menu-container">

    <img
        src="{{ url_for('static', filename='loading-spinner.svg') }}"
        alt="Loading"
        id="loading"
    >

    <!-- RESTAURANT STRIP -->

    <section class="res-strip">

        <nav class="breadcrumbs">
            Home / Hyderabad / <span>Burger King</span>
        </nav>

        <div class="res-header">

            <div class="res-info">
                <h1>Burger King</h1>
                <p class="res-location">Banjara Hills, 2.5 km</p>
            </div>

        </div>

        <div class="res-delivery-info">

            <span>
                <i class="fa-solid fa-clock"></i>
                25-30 MINS
            </span>

            <span>
                <i class="fa-solid fa-indian-rupee-sign"></i>
                ₹350 for two
            </span>

        </div>

    </section>


    <!-- SEARCH -->

    <div class="search-bar">

        <div class="search-shell">

            <button class="search-back" id="searchBackBtn" type="button" aria-label="Go back">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search for items"
                autocomplete="off"
            >

            <button class="search-clear" id="searchClearBtn" type="button" aria-label="Clear search">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

    </div>


    <!-- CATEGORY RAIL -->

    <nav
        class="category-rail"
        id="categoryTabs"
        role="tablist"
        aria-label="Food categories"
    >
        <!-- "All" chip + dynamic category chips injected here -->
    </nav>


    <!-- FILTER ROW -->

    <div class="filter-row" id="filterRow">

        <select class="filter-select" id="sortSelect" aria-label="Sort items">
            <option value="default">Sort: Recommended</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A to Z</option>
        </select>

        <button class="filter-toggle" id="stockToggle" type="button">
            <i class="fa-solid fa-circle-check"></i>
            In stock only
        </button>

        <div class="filter-divider" id="subDivider" style="display:none;"></div>

        <!-- SUBCATEGORY CHIPS -->

        <div
            class="subcategory-tabs"
            id="subcategoryTabs"
            role="tablist"
            aria-label="Food subcategories"
        ></div>

    </div>


    <p class="result-meta" id="resultMeta"></p>


    <!-- MENU GRID -->

    <section
        class="menu-section"
        id="menu_container"
    ></section>


    <!-- REPLACE CART MODAL -->

    <div
        class="overlay"
        id="overlayContainer"
    ></div>

    <section
        id="ReplaceContainer"
        aria-hidden="true"
    >

        <span id="message">
            Error:
        </span>

        <div id="controlBtn">

            <button id="NO" type="button">
                NO
            </button>

            <button id="YES" type="button">
                YES
            </button>

        </div>

    </section>

</main>


<!-- CART FOOTER -->

<footer>

    <div id="goToCartContainer">

        <div id="TotalPrice">
            <span>Total</span>
            <span id="amount">0</span>
        </div>

        <span id="GoCartBtn">
            View cart
            <i class="fa-solid fa-chevron-right"></i>
        </span>

    </div>

</footer>


<script src="{{ url_for('static', filename='menu.js') }}"></script>

</body>

</html>
