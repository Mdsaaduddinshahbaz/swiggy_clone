{% extends "base.html" %}

{% block title %}
Orders
{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='seller_orders.css') }}">
{% endblock %}

{% block content %}
    <div class="overlay" id="overlayContainer"></div>
    <div class="orders-container">
    <div class="header">
        <div style="display: flex;">
        <button id="menuToggle" class="menu-toggle">
          ☰
        </button>
        <h1>Your Orders</h1>
        </div>
        <button id="scanQrBtn" type="button" style="
            background: #E8491D;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            position: absolute;
            right: 10px;
            white-space: nowrap;
        ">📷 Scan QR</button>
        <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
            <select id="filterDropdown">
                <option value="placed">Pending</option>
                <option value="all">All Orders</option>
                <option value="completed">Completed</option>
                <option value="canceled">Canceled</option>
            </select>
        </div>
    </div>
    <p id="noOrdersMessage" style="display: none;"></p>
    <div id="orders-list"></div>
</div>
<div style="margin-bottom: 40px;">
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='seller_orders.js') }}"></script>
{% endblock %}
