<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../static/home.css">
    <style>
        .hill-tab {
    position: relative;
    width: 100px;
    height: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 10px;
}

.hill-bg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.hill-bg path {
    fill: linear-gradient(180deg, #2a1245, #0d0414); /* fallback, see note below */
    stroke: #b08fe0;
    stroke-width: 1.5;
}

.tab-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.tab-icon {
    font-size: 26px;
    line-height: 1;
}

.tab-label {
    color: #fff;
    font-weight: 600;
    font-size: 13px;
}
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="left-nav">
                <img src="../static/logo2.png" alt="Swiggy Logo" class="logo">
                <div class="location-overlay" id="locationOverlay"></div>
                <div class="location-trigger" id="locationTrigger">
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="currentAddress">
                        Select Location
                    </span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="location-box visible" id="locationBox">
                    <div class="location-header">
                        <i class="fa-solid fa-location-dot"></i>
                        <span id="currentAddresss">
                            Select delivery location
                        </span>
                    </div>

                    <div class="location-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="addressInput" placeholder="Search for area, street, city...">
                    </div>
                    <div id="savedAddress">
                        <h2 style="color: black;
    top: 10px;
    font-size: 22px;
    left: 5px;
    margin: ne;
    position: relative;">Saved Address</h2>
                    </div>
                    <button id="liveLocationBtn" class="live-location-btn">
                        <i class="fa-solid fa-location-crosshairs"></i>
                        Use Current Location
                    </button>
                    <button id="map_btn" class="live-location-btn" is_active=false>
                        <i class="fa-solid fa-location-crosshairs">
                        </i>
                        Select on Map
                    </button>
                    <div id="map_container">
                    <div id="map" style="height: 250px; border-radius: 15px; margin-top: 10px;"></div>
                    </div>
                    <div id="suggestions"></div>
                </div>
            </div>
            <li class="active hill-tab">
    <svg class="hill-bg" viewBox="0 0 140 110" preserveAspectRatio="none">
        <path d="M5,105 
                 C5,105 5,40 15,30 
                 C25,15 45,8 70,8 
                 C95,8 115,15 125,30 
                 C135,40 135,105 135,105 
                 Z" />
    </svg>
    <div class="tab-content">
        <span class="tab-icon">🍔</span>
        <span class="tab-label">Food</span>
    </div>
</li>
            <nav class="right-nav">
                <div class="search-container" id="searchContainer">
                    <input type="text" id="searchInput" placeholder="Search Resturant name...." id="search" />
                </div>
                <ul>
                    <li id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Search</li>
                    <!-- <li><i class="fa-solid fa-percent"></i> Offers <span class="new-tag">NEW</span></li> -->
                    <!-- <li><i class="fa-solid fa-life-ring"></i> Help</li> -->
                    <!-- <li><i class="fa-solid fa-user"></i> Sign In</li> -->
                    <li id="orderBtn"><i class="fa-solid fa-user"></i> Orders</li>
                    <li id="cartBtn"><i class="fa-solid fa-cart-shopping"></i> Cart</li>
                </ul>
            </nav>
        </div>
    </header>
</body>
</html>
