<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        .floating-nav {
            justify-content: space-between;
            z-index:1;
            width: 87%;
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);

            display: flex;
            gap: 12px;

            padding: 10px;

            background: rgba(255, 255, 255, .75);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, .4);

            border-radius: 22px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, .12);

            /* z-index: 9999; */
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;

            border: none;
            background: transparent;

            padding: 3px 18px;

            border-radius: 14px;

            cursor: pointer;

            transition: .25s;
        }

        .nav-btn i {
            width: 18px;
            height: 18px;
        }

        .nav-btn:hover {
            background: #f2f4f7;
        }

        .nav-btn.active {
            background: #0F172A;
            color: white;
        }
    </style>
    <!-- Common CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='seller_dashboard.css') }}">

    <!-- Page-specific CSS -->
    {% block styles %}
    {% endblock %}

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body>

    {% include 'sidebar.html' %}

    <main class="main-content" style="width: 100%;">
        {% block content %}
        {% endblock %}
        <div class="floating-nav">
            <button class="nav-btn {% if page == 'dashboard' %}active{% endif %}" id="DashboardsBtn">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </button>

            <button class="nav-btn {% if page == 'inventory' %}active{% endif %}" id="InventorysBtn">
                <i data-lucide="package"></i>
                <span>Inventory</span>
            </button>

            <button class="nav-btn {% if page == 'orders' %}active{% endif %}" id="OrderrBtn">
                <i data-lucide="shopping-bag"></i>
                <span>Orders</span>
            </button>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
    <script src="{{ url_for('static', filename='base.js') }}"></script>
    <script src="{{ url_for('static', filename='sidebar.js') }}"></script>
    {% block scripts %}
    {% endblock %}

</body>

</html>
