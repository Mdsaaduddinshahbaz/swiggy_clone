<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurant Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6E1B12">
<link rel="stylesheet" href="seller_profile.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo">Seller Panel</div>

  <div class="nav-item" id="navDashboard"><i class="fa-solid fa-gauge"></i> Dashboard</div>
  <div class="nav-item" id="navOrders"><i class="fa-solid fa-box"></i> Orders</div>
  <div class="nav-item" id="navMenu"><i class="fa-solid fa-burger"></i> Menu</div>
  <div class="nav-item" id="navAnalytics"><i class="fa-solid fa-chart-simple"></i> Analytics</div>
  <div class="nav-item active" id="navProfile"><i class="fa-solid fa-store"></i> Profile</div>
</div>

<!-- Main -->
<div class="main">

  <div class="header">
    <h1>Restaurant Profile</h1>
    <button class="edit-toggle" id="editToggle"><i class="fa-solid fa-pen"></i> Edit</button>
  </div>

  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <p>Loading profile...</p>
  </div>

  <form id="profileForm" class="profile-grid" style="display:none;">

    <!-- Left: identity card -->
    <div class="identity-card">
      <div class="banner" id="bannerPreview">
        <img id="bannerImg" src="" alt="" style="display:none;">
        <label for="bannerInput" class="banner-edit"><i class="fa-solid fa-camera"></i></label>
        <input type="file" id="bannerInput" accept="image/*" hidden>
      </div>

      <div class="avatar-wrap">
        <div class="avatar" id="avatarPreview">
          <img id="avatarImg" src="" alt="" style="display:none;">
          <span id="avatarInitial">R</span>
          <label for="avatarInput" class="avatar-edit"><i class="fa-solid fa-camera"></i></label>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
      </div>

      <div class="identity-body">
        <input type="text" id="resName" class="name-input" placeholder="Restaurant name" disabled>
        <div class="status-row">
          <label class="switch">
            <input type="checkbox" id="openToggle" disabled>
            <span class="slider"></span>
          </label>
          <span id="openLabel">Open for orders</span>
        </div>
        <div class="rating-chip">
          <i class="fa-solid fa-star"></i>
          <span id="ratingValue">4.2</span>
          <span class="rating-count" id="ratingCount">(0 ratings)</span>
        </div>
      </div>
    </div>

    <!-- Right: details -->
    <div class="details-card">

      <div class="section">
        <h3>Contact</h3>
        <div class="field-grid">
          <div class="input-group">
            <label for="ownerName">Owner Name</label>
            <input type="text" id="ownerName" disabled>
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" disabled>
          </div>
          <div class="input-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" disabled>
          </div>
          <div class="input-group">
            <label for="cuisine">Cuisine Type</label>
            <input type="text" id="cuisine" placeholder="e.g. Burgers, American" disabled>
          </div>
        </div>
      </div>

      <div class="section">
        <h3>Location</h3>
        <div class="field-grid">
          <div class="input-group span-2">
            <label for="address">Address</label>
            <input type="text" id="address" disabled>
          </div>
        </div>
      </div>

      <div class="section">
        <h3>Hours</h3>
        <div class="field-grid">
          <div class="input-group">
            <label for="openTime">Opens</label>
            <input type="time" id="openTime" disabled>
          </div>
          <div class="input-group">
            <label for="closeTime">Closes</label>
            <input type="time" id="closeTime" disabled>
          </div>
        </div>
      </div>

      <div class="form-actions" id="formActions" style="display:none;">
        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="saveBtn">Save Changes</button>
      </div>

    </div>
  </form>

</div>

<script src="seller_profile.js"></script>
</body>
</html>
